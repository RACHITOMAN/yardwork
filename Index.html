<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yard Container Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f5f5f4;
  --bg3: #eeede9;
  --text: #1a1a1a;
  --text2: #6b6b6b;
  --text3: #9b9b9b;
  --border: rgba(0,0,0,0.12);
  --border2: rgba(0,0,0,0.22);
  --radius: 8px;
  --radius-lg: 12px;
  --info-bg: #E6F1FB;
  --info-text: #0C447C;
  --success-bg: #E1F5EE;
  --success-text: #085041;
  --warn-bg: #FAEEDA;
  --warn-text: #633806;
  --danger-bg: #FCEBEB;
  --danger-text: #A32D2D;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1c;
    --bg2: #252525;
    --bg3: #2e2e2e;
    --text: #f0f0f0;
    --text2: #a0a0a0;
    --text3: #666;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.2);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: var(--text); background: var(--bg3); min-height: 100vh; }
.topbar { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; }
.topbar-left { display: flex; align-items: center; gap: 16px; }
.app-title { font-size: 16px; font-weight: 500; }
.today-label { font-size: 12px; color: var(--text2); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
.stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
.stat-num { font-size: 22px; font-weight: 500; margin-top: 3px; }
.stat-label { font-size: 11px; color: var(--text2); }
.tabs { display: flex; border-bottom: 0.5px solid var(--border); margin-bottom: 1.25rem; background: var(--bg); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 0 0.5rem; overflow-x: auto; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; color: var(--text2); border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; white-space: nowrap; }
.tab.active { color: var(--text); border-bottom: 2px solid var(--text); font-weight: 500; }
.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.section-title { font-size: 15px; font-weight: 500; margin-bottom: 1rem; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; font-size: 14px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { box-shadow: 0 0 0 2px rgba(0,0,0,0.15); }
.field textarea { height: 58px; resize: vertical; }
.btn { padding: 7px 14px; font-size: 13px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; font-weight: 500; transition: background 0.1s; }
.btn:hover { background: var(--bg2); }
.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn-primary:hover { opacity: 0.85; }
.btn-client{
  background:#2563eb;
  color:#fff;
  border:none;
}

.btn-bulk{
  background:#16a34a;
  color:#fff;
  border:none;
}
.btn-sm { padding: 3px 9px; font-size: 12px; }
.btn-danger { border-color: #E24B4A; color: #A32D2D; }
.btn-danger:hover { background: #FCEBEB; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left;
  padding: 7px 8px;
  font-weight: 700;
  font-size: 14px;
color: #000;
  background: #e2e2e2;
  border-bottom: 0.5px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
td { padding: 7px 8px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.tfoot-row td { font-weight: 500; background: var(--bg2); }
.badge { display: inline-block; padding: 4px 10px; border-radius: var(--radius); font-size: 13px; font-weight: 600; }
.badge-in { background: #E1F5EE; color: #085041; }
.badge-out { background: #EAF3DE; color: #27500A; }
.badge-cross { background: #EEEDFE; color: #3C3489; }
.badge-warn { background: #FAEEDA; color: #633806; }
.badge-inv { background: #E6F1FB; color: #0C447C; }
.badge-paid { background: #E3F6E8; color: #1D7A3C; cursor: pointer; }
.badge-unpaid { background: #FDECEC; color: #B3261E; cursor: pointer; }
.row-warn { background: rgba(250,238,218,0.3); }
.row-inyard { background: rgba(225,245,238,0.15); }
table tbody tr:nth-child(even) {
  background: #ebebeb;

}
.highlight-error { background: rgba(252,235,235,0.35); }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.filter-bar input, .filter-bar select { padding: 6px 10px; font-size: 13px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); }
.empty { text-align: center; padding: 2rem; color: var(--text2); font-size: 13px; }
.sep { height: 0.5px; background: var(--border); margin: 1rem 0; }
.op-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.op-btn { flex: 1; padding: 9px 4px; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; text-align: center; font-size: 12px; background: var(--bg); color: var(--text2); }
.op-btn.sel-unload { border-color: #1D9E75; background: #E1F5EE; color: #085041; font-weight: 500; }
.op-btn.sel-load { border-color: #639922; background: #EAF3DE; color: #27500A; font-weight: 500; }
.op-btn.sel-cross { border-color: #7F77DD; background: #EEEDFE; color: #3C3489; font-weight: 500; }
.info-box { padding: 8px 10px; border-radius: var(--radius); font-size: 12px; margin-top: 8px; background: var(--bg2); color: var(--text2); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 1.5rem; width: 460px; max-width: 96vw; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
.client-avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; }
.client-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.client-row:last-child { border-bottom: none; }
.client-summary { font-size: 12px; color: var(--text2); margin-top: 2px; }
.overflow-x { overflow-x: auto; }
@media (max-width: 600px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr; }
  .topbar { padding: 0 1rem; }
  .container { padding: 1rem 0.5rem; }
}

/* ── Per-client detail panel ── */
.client-detail-panel { border:0.5px solid var(--border); border-radius: var(--radius-lg); overflow:hidden; margin-top:1rem; background:var(--bg); }
.cdp-header { display:flex; align-items:center; gap:12px; padding:1rem 1.25rem; border-bottom:0.5px solid var(--border); background:var(--bg2); flex-wrap:wrap; }
.cdp-tabs { display:flex; border-bottom:0.5px solid var(--border); padding:0 1rem; overflow-x:auto; background:var(--bg); }
.cdp-tab { padding:8px 14px; cursor:pointer; font-size:12px; color:var(--text2); border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; white-space:nowrap; }
.cdp-tab.active { color:var(--text); border-bottom:2px solid var(--text); font-weight:500; }
.cdp-body { padding:1rem 1.25rem; }
.stat-clickable { cursor:pointer; transition:box-shadow 0.15s; }
.stat-clickable:hover { box-shadow: 0 0 0 2px #2563eb44; }


/* Lock screen */
#lock-screen {
  display:none; position:fixed; inset:0; background:var(--bg3);
  z-index:999; align-items:center; justify-content:center; flex-direction:column;
}
#lock-screen.show { display:flex; }
.lock-card {
  background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius-lg);
  padding:2.5rem 2rem; max-width:420px; width:90%; text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.12);
}
.lock-icon { font-size:48px; margin-bottom:1rem; }
.lock-title { font-size:20px; font-weight:600; margin-bottom:0.5rem; }
.lock-user { font-size:14px; color:var(--text2); margin-bottom:1.5rem; line-height:1.5; }
.lock-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.lock-time { font-size:12px; color:var(--text2); margin-top:1rem; }

/* Client portal mode — applied to <body> when ?client= is in URL */
body.client-portal #topbar-right { display: none !important; }
body.client-portal #tab-btn-clients { display: none !important; }
body.client-portal #tab-btn-rates { display: none !important; }
body.client-portal #tab-btn-unpaid { display: none !important; }
body.client-portal .global-client-filter { display: none !important; }
body.client-portal #stats { display: none !important; }
body.client-portal .btn-danger { pointer-events: none; opacity: 0.3; }
body.client-portal .btn[onclick*="openEditDates"],
body.client-portal .btn[onclick*="deleteEntry"],
body.client-portal .btn[onclick*="markLoaded"],
body.client-portal .btn[onclick*="openInvModal"],
body.client-portal .btn[onclick*="bulkInvoice"],
body.client-portal .btn[onclick*="unmarkInvoice"] { display: none !important; }

</style>
</head>
<body>
<script>
// Apply client-portal class to body IMMEDIATELY — before any element renders
if (new URLSearchParams(window.location.search).get('client')) {
  document.body.classList.add('client-portal');
}
</script>

<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">System In Use</div>
    <div class="lock-user" id="lock-user-msg">Another user is currently using the system.</div>
    <div class="lock-actions">
      <button class="btn btn-primary" onclick="takeover()">Take Over</button>
      <button class="btn" onclick="refreshLock()"><i class="ti ti-refresh"></i> Refresh</button>
    </div>
    <div class="lock-time" id="lock-time-msg"></div>
  </div>
</div>

<div id="loading-screen" style="display:flex;position:fixed;inset:0;background:var(--bg3);z-index:998;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div style="font-size:32px">📦</div>
  <div style="font-size:16px;font-weight:500">Yard Container Tracker</div>
  <div style="font-size:13px;color:var(--text2)" id="loading-msg">Loading data…</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <div>
      <div class="app-title"><i class="ti ti-container" aria-hidden="true"></i> Yard Container Tracker</div>
      <div class="today-label" id="today-label"></div>
    </div>
  </div>
<div class="topbar-right" id="topbar-right">
    <span id="sync-status" style="font-size:12px;color:var(--text2);min-width:70px;text-align:right"></span>
    <select id="global-client-filter" onchange="applyClientFilter()" style="padding:6px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text)">
      <option value="">All clients</option>
    </select>
 <button class="btn" onclick="syncNow()">
  Sync
</button>

<button class="btn btn-client" onclick="openClientModal()">
<i class="ti ti-user-plus"></i>
  Add Client
</button>

<button class="btn btn-primary" onclick="openAddModal()">
  <i class="ti ti-plus"></i>
  New Entry
</button>
<button class="btn btn-bulk" onclick="openBulkModal()">
<i class="ti ti-stack-2"></i>
  Bulk Entry
</button>
<button class="btn" onclick="releaseAndExit()">
  Release Lock
</button>
  </div>
</div>


<div class="container">
  <div class="stats-grid" id="stats"></div>

  <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
    <div class="tabs" id="tabs">
      <button id="tab-btn-yard"      class="tab active" onclick="switchTab('yard',this)">In Yard</button>
<button id="tab-btn-all"       class="tab"        onclick="switchTab('all',this)">All Transactions</button>
<button id="tab-btn-pending"   class="tab"        onclick="switchTab('pending',this)">Pending Invoice</button>
<button id="tab-btn-invoiced"  class="tab"        onclick="switchTab('invoiced',this)">Invoiced</button>
<button id="tab-btn-payments"  class="tab"        onclick="switchTab('payments',this)">Pending Payment</button>
<button id="tab-btn-unpaid"    class="tab"        onclick="switchTab('unpaid',this)">Unpaid Invoices</button>
<button id="tab-btn-clients"   class="tab"        onclick="switchTab('clients',this)">Clients</button>
<button id="tab-btn-rates"     class="tab"        onclick="switchTab('rates',this)">Rate Sheet</button>
    </div>
    <div style="padding:1.25rem">
      <div id="tab-yard"></div>
      <div id="tab-all"      style="display:none"></div>
      <div id="tab-pending"  style="display:none"></div>
      <div id="tab-invoiced" style="display:none"></div>
      <div id="tab-payments" style="display:none"></div>
      <div id="tab-unpaid"   style="display:none"></div>
      <div id="tab-clients"  style="display:none"></div>
      <div id="tab-rates"    style="display:none"></div>
    </div>
  </div>
</div>

<!-- Add Entry Modal -->
<div id="modal-add" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">New container entry</div>
    <div class="op-row">
      <button class="op-btn" id="btn-unload" onclick="setOp('unload')"><i class="ti ti-arrow-bar-to-down" aria-hidden="true"></i> Unloading</button>
      <button class="op-btn" id="btn-cross" onclick="setOp('cross')"><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Cross-loading</button>
    </div>
    <div class="grid2" style="margin-bottom:10px">
      <div class="field">
        <label>Container no.</label>
        <input id="f-cnum" placeholder="e.g. MSCU1234567" style="text-transform:uppercase">
      </div>
      <div class="field">
        <label>Date</label>
        <input id="f-date" type="date">
      </div>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Client</label>
      <select id="f-client"><option value="">— Select client —</option></select>
    </div>
    <div class="field" style="margin-bottom:10px">
     <label>Sales Ref</label>
<input id="f-salesref" placeholder="Sales person">
    </div>
    <div class="field">
      <label>Remarks</label>
      <textarea id="f-remarks" placeholder="Optional notes"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-add')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save entry</button>
    </div>
  </div>
</div>
<div id="modal-bulk" class="modal-overlay">
  <div class="modal">

    <div class="modal-title">
      Bulk Container Entry
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Client</label>
      <select id="bulk-client"></select>
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Sales Ref</label>
      <input id="bulk-salesref" placeholder="Sales person">
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Default Gate In Date</label>
      <input id="bulk-date" type="date">
    </div>

   <div class="field">
     <label>Container Numbers</label>
     <textarea
       id="bulk-list"
       style="height:220px"
       placeholder="REGU1235760&#10;REGU3228672&#10;TGBU8071201"></textarea>
   </div>

   <button
     class="btn"
     onclick="generateBulkRows()">
     Generate
   </button>

   <div id="bulk-preview" style="margin-top:10px"></div>

<div class="modal-btns">
  <button
    class="btn"
    onclick="closeModal('modal-bulk')">
    Cancel
  </button>

  <button
    class="btn btn-primary"
    onclick="saveBulkEntries()">
    Save All
  </button>
</div>

  </div>
</div>
<!-- Client Modal -->

<div id="modal-client" class="modal-overlay">
  <div class="modal">

<div class="modal-title" id="client-modal-title">
  Add Client
</div>

<div class="field" style="margin-bottom:10px">
  <label>Client Name</label>
  <input
    id="cl-name"
    placeholder="Company or person name">
</div>

<div class="modal-btns">
  <button
    class="btn"
    onclick="closeModal('modal-client')">
    Cancel
  </button>

  <button
    class="btn btn-primary"
    onclick="saveClient()">
    Save Client
  </button>
</div>

  </div>
</div>

<!-- Invoice Modal -->
<div id="modal-invoice" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Mark as invoiced</div>
    <div class="field">
      <label>Invoice number</label>
      <input id="inv-num" placeholder="e.g. INV-2024-001">
    </div>
    <div class="info-box" style="margin-top:8px" id="inv-desc"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-invoice')">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Save</button>
    </div>
  </div>
</div>

<div id="modal-load" class="modal-overlay">
  <div class="modal">

    <div class="modal-title">
      Mark Container Loaded
    </div>

    <div class="field">
      <label>Load Date</label>
      <input id="load-date" type="date">
    </div>

    <div class="modal-btns">
      <button
        class="btn"
        onclick="closeModal('modal-load')">
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="saveLoadedDate()">
        Save
      </button>
    </div>

  </div>
</div>

<div id="modal-edit-dates" class="modal-overlay">
  <div class="modal">

    <div class="modal-title">
      Edit Entry
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Container No.</label>
      <input id="edit-cnum" type="text">
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Client</label>
      <select id="edit-client"></select>
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Sales Ref</label>
      <input id="edit-salesref" type="text">
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Unload Date</label>
      <input id="edit-unload-date" type="date">
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Load Date</label>
      <input id="edit-load-date" type="date">
    </div>

    <div class="field" style="margin-bottom:10px">
      <label>Remarks</label>
      <textarea id="edit-remarks" placeholder="Optional notes"></textarea>
    </div>

    <div class="modal-btns">
      <button class="btn"
              onclick="closeModal('modal-edit-dates')">
        Cancel
      </button>

      <button class="btn btn-primary"
              onclick="saveEditedDates()">
        Save
      </button>
    </div>

  </div>
</div>

<div id="modal-paid" class="modal-overlay">
  <div class="modal">

    <div class="modal-title">
      Mark Invoice Paid
    </div>

    <div class="field">
      <label>Payment Date</label>
      <input id="paid-date" type="date">
    </div>

    <div class="modal-btns">
      <button
        class="btn"
        onclick="closeModal('modal-paid')">
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="savePaidDate()">
        Save
      </button>
    </div>

  </div>
</div>

<div id="modal-bulk-load" class="modal-overlay">
  <div class="modal" style="max-width:480px">

    <div class="modal-title">
      Mark Containers Loaded
    </div>

    <div id="bulk-load-rows" style="max-height:320px;overflow-y:auto;margin-bottom:10px"></div>

    <div class="modal-btns">
      <button class="btn"
              onclick="closeModal('modal-bulk-load')">
        Cancel
      </button>

      <button class="btn btn-primary"
              onclick="saveBulkLoad()">
        Save all
      </button>
    </div>

  </div>
</div>

<script>

// ── Detect client portal immediately on script parse, before anything else ──
window._IS_CLIENT_PORTAL = !!(new URLSearchParams(window.location.search).get('client'));
if (window._IS_CLIENT_PORTAL) {
  // Apply CSS class to body immediately — hides all admin UI via CSS, survives re-renders
  document.addEventListener('DOMContentLoaded', function() {
    document.body.classList.add('client-portal');
    const ls = document.getElementById('lock-screen');
    if (ls) ls.style.display = 'none';
  });
  // Also try immediately in case DOM is already ready
  if (document.body) document.body.classList.add('client-portal');
}

/*

const STORAGE_RATE_PER_DAY = 3; // flat rate, RO per day
const OP_UNLOAD = 15, OP_CROSS = 20; // unload+load together = RO 30
const AV_BG = ['#E1F5EE','#EEEDFE','#E6F1FB','#FAEEDA','#FAECE7','#EAF3DE','#FBEAF0'];
const AV_TX = ['#085041','#3C3489','#0C447C','#633806','#712B13','#27500A','#72243E'];

let DB = [], CLIENTS = [];
let currentOp = 'unload';
let currentTab = 'yard';
let globalClientFilter = '';
let editingClientId = null;
let pendingInvEntry = null;
let currentLoadId = null;
let currentEditId = null;

let selectedLoad = new Set();

const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3ss8baMQNMQyQoqdLsaGhjxDFUxfxpo-61lqAM4WMYQvDeRv9ifWIGkQGc0DK-ulG8Q/exec';

async function loadData(skipLock) {
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL);
    const data = await res.json();
    DB = data.transactions || [];
    CLIENTS = data.clients || [];
    // Only populate lock info when NOT in client portal mode
    if (!skipLock) {
      window.LOCK_INFO = data.lock || {};
    } else {
      window.LOCK_INFO = {}; // client portal always sees no lock
    }
  } catch(e) {
    console.error('Load error', e);
    DB = [];
    CLIENTS = [];
    window.LOCK_INFO = {};
  }
}

function setSyncStatus(state) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (state === 'saving') el.textContent = 'Saving…';
  else if (state === 'saved') { el.textContent = 'Saved'; setTimeout(() => { if (el.textContent === 'Saved') el.textContent = ''; }, 1500); }
  else if (state === 'error') el.textContent = 'Sync failed';
  else el.textContent = '';
}

// Guard against wiping the sheet if loadData() never populated CLIENTS/DB
// (e.g. first load failed). Adjust these floors if your real dataset is smaller.
const MIN_CLIENTS_TO_SAVE = 20;
const MIN_TRANSACTIONS_TO_SAVE = 100;

async function saveData() {
  if (CLIENTS.length < MIN_CLIENTS_TO_SAVE || DB.length < MIN_TRANSACTIONS_TO_SAVE) {
    alert(`Save blocked.\n\nLoaded only ${CLIENTS.length} clients and ${DB.length} transactions.`);
    return;
  }
  setSyncStatus('saving');
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({
        action: 'saveAll',
        clients: CLIENTS,
        transactions: DB
      })
    });
    setSyncStatus('saved');
  } catch (e) {
    console.error('Save error', e);
    setSyncStatus('error');
  }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today() {
  // The yard's day is reported overnight and this system is updated the
  // next morning, so "today" here is always yesterday's calendar date.
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmt(d) {
  if (!d) return '–';
  return new Date(d).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
}

function clientById(id) { return CLIENTS.find(c => c.id === id) || null; }
function clientName(id) { const c = clientById(id); return c ? c.name : '–'; }
function avatarIdx(id) { const i = CLIENTS.findIndex(c => c.id === id); return i < 0 ? 0 : i % AV_BG.length; }
function initials(name) { return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2); }

function calcStorage(a, b) {
  // Same-day gate in and gate out: no storage charge.
  if (a && b && a === b) return { days: 0, cost: 0 };
  const da = new Date(a), db = b ? new Date(b) : new Date(today());
  const days = Math.max(1, Math.ceil((db - da) / 864e5));
  return { days, cost: days * STORAGE_RATE_PER_DAY };
}
function generateBulkRows() {

  const defaultDate =
    document.getElementById('bulk-date').value;

  const lines =
    document.getElementById('bulk-list')
      .value
      .split('\n')
      .map(x => x.trim().toUpperCase())
      .filter(Boolean);

  let html = `
    <table style="width:100%">
      <tr>
        <th>Container</th>
        <th>Date</th>
      </tr>
  `;

  lines.forEach((cnum,i) => {

    html += `
      <tr>
        <td>${cnum}</td>
        <td>
          <input
            type="date"
            id="bulk-row-date-${i}"
            value="${defaultDate}">
        </td>
      </tr>
    `;

  });

  html += '</table>';

  document.getElementById('bulk-preview')
    .innerHTML = html;
}

function calcTotal(e) {

  if (e.op === 'cross') {
    return {
      days: 0,
      storageCost: 0,
      opCost: OP_CROSS,
      total: OP_CROSS
    };
  }

  const { days, cost } =
    calcStorage(
      e.unloadDate,
      e.loadDate || null
    );

  let opCost = OP_UNLOAD;

  if (e.loaded) {
    opCost += OP_UNLOAD;
  }

  return {
    days,
    storageCost: cost,
    opCost,
    total: cost + opCost
  };
}

async function saveBulkLoad() {
  const inputs = document.querySelectorAll('.bulk-load-date');
  let count = 0;
  inputs.forEach(inp => {
    const date = inp.value;
    if (!date) return;
    const e = DB.find(x => x.id === inp.dataset.id);
    if (!e) return;
    e.loaded = true;
    e.loadDate = date;
    count++;
  });
  selectedLoad.clear();
  closeModal('modal-bulk-load');
  render();
  saveData();
  alert(`Marked ${count} container(s) as loaded.`);
}
async function saveBulkEntries() {

  const clientId =
    document.getElementById('bulk-client').value;

  const salesRef =
    document.getElementById('bulk-salesref')
      .value.trim();

  const lines =
    document.getElementById('bulk-list')
      .value
      .split('\n')
      .map(x => x.trim().toUpperCase())
      .filter(Boolean);

  if (!clientId) {
    alert('Select a client.');
    return;
  }

  let added = 0;
const skippedExisting = [];
const skippedRepeated = [];
const seenInUpload = new Set();

for (const [i, cnum] of lines.entries()) {

  const date =
    document.getElementById(
      `bulk-row-date-${i}`
    ).value;

   if (!/^[A-Z]{4}[0-9]{7}$/.test(cnum))
     continue;

   if (seenInUpload.has(cnum)) {
     skippedRepeated.push(cnum);
     continue;
   }

   seenInUpload.add(cnum);

   const duplicate = DB.find(
     e =>
       !e.deleted &&
       e.containerNo === cnum
   );

   if (duplicate) {
     skippedExisting.push(cnum);
     continue;
}

    DB.push({
      id: uid(),
      containerNo: cnum,
      op: 'unload',
      unloadDate: date,
      loaded: false,
      loadDate: '',
      clientId,
      salesRef,
      remarks: '',
      invoiceNo: '',
      invoiced: false,
      deleted: false,
      createdAt: new Date().toISOString()
    });

    added++;
  }

  closeModal('modal-bulk');
  render();
  saveData(); // fire-and-forget: local DB already has the new entries

 let msg =
   `Imported: ${added}\n\n`;

 msg +=
   `Skipped Existing: ${skippedExisting.length}\n`;

 if (skippedExisting.length) {
   msg +=
     '\nSkipped Existing:\n' +
     skippedExisting.join('\n') +
     '\n';
 }

 msg +=
   `\nSkipped Repeated In Upload: ${skippedRepeated.length}\n`;

 if (skippedRepeated.length) {
   msg +=
     '\nSkipped Repeated In Upload:\n' +
     skippedRepeated.join('\n');
 }

alert(msg);
}

function populateClientDropdowns() {
  const sel = document.getElementById('f-client');
  const gf = document.getElementById('global-client-filter');
  const ef = document.getElementById('edit-client');
  const prev = sel.value;
  const prevEf = ef ? ef.value : '';
  const sorted = CLIENTS.filter(c => !c.deleted).sort((a,b) => a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">— Select client —</option>';
  gf.innerHTML = '<option value="">All clients</option>';
  if (ef) ef.innerHTML = '<option value="">— Select client —</option>';
  sorted.forEach(c => {
    sel.innerHTML += `<option value="${c.id}">${c.name}${c.code ? ' (' + c.code + ')' : ''}</option>`;
    gf.innerHTML += `<option value="${c.id}"${globalClientFilter === c.id ? ' selected' : ''}>${c.name}</option>`;
    if (ef) ef.innerHTML += `<option value="${c.id}">${c.name}${c.code ? ' (' + c.code + ')' : ''}</option>`;
  });
  if (prev) sel.value = prev;
  if (ef && prevEf) ef.value = prevEf;
}

async function deleteClient(id) {

  const c = clientById(id);

  if (!c) {
    alert('Client not found.');
    return;
  }

  const hasTx =
    DB.filter(e => !e.deleted && e.clientId === id).length;

  const msg =
    hasTx
      ? `${c.name} has ${hasTx} transaction(s). Delete client anyway?`
      : `Delete client ${c.name}?`;

  if (!confirm(msg)) return;

  c.deleted = true;

  populateClientDropdowns();
  render();
  saveData();
}

function openInvModal(id) {

  document.getElementById('inv-num').value = pendingInvEntry.invoiceNo || '';
  const { total } = calcTotal(pendingInvEntry);
  document.getElementById('inv-desc').textContent = `Container: ${pendingInvEntry.containerNo} | Client: ${clientName(pendingInvEntry.clientId)} | Total: RO ${total.toFixed(2)}`;
  document.getElementById('modal-invoice').classList.add('open');
}

async function saveInvoice() {
  const n = document.getElementById('inv-num').value.trim();

  if (pendingInvEntry) { pendingInvEntry.invoiceNo = n; pendingInvEntry.invoiced = true; render(); saveData(); }

}

function savePaidDate() {
  const date = document.getElementById('paid-date').value;
  if (!date) return;
  currentPaidIds.forEach(id => {
    const e = DB.find(x => x.id === id);
    if (e) e.paidDate = date;
  });
  currentPaidIds = [];
  selectedInvoices.clear();
  closeModal('modal-paid');
  render();
  saveData();
}

function selectInvoiceGroup(invoiceNo) {
  const ids = DB.filter(e => !e.deleted && e.invoiced && String(e.invoiceNo) === String(invoiceNo)).map(e => e.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedInvoices.has(id));
  ids.forEach(id => allSelected ? selectedInvoices.delete(id) : selectedInvoices.add(id));
  render();
}

  await fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain'
    },
    body: JSON.stringify({
      action: 'acquireLock',
      user
    })
  });

}
async function releaseLockClient() {

  await fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain'
    },
    body: JSON.stringify({
      action: 'releaseLock'
    })
  });
  }

  if (!confirm(
    'Release system lock?'
  )) return;

  await releaseLockClient();

  alert(
    'Lock released.'

  location.reload();

}

function filterByClient(data) {
  return globalClientFilter ? data.filter(e => e.clientId === globalClientFilter) : data;
}

 const rowClass =

function renderAllTable() {
  let data = DB.filter(e => !e.deleted);
  if (globalClientFilter) data = data.filter(e => e.clientId === globalClientFilter);
  const search = (document.getElementById('f-search')?.value || '').toLowerCase();
  const status = document.getElementById('f-status')?.value || '';
  const inv = document.getElementById('f-inv2')?.value || '';
  const cl = document.getElementById('f-cl2')?.value || '';
  if (search) data = data.filter(e => e.containerNo.toLowerCase().includes(search) || (clientName(e.clientId)||'').toLowerCase().includes(search));
  if (status === 'inyard') data = data.filter(e => e.op === 'unload' && !e.loadDate);
  else if (status === 'departed') data = data.filter(e => e.op === 'unload' && e.loadDate);
  else if (status === 'cross') data = data.filter(e => e.op === 'cross');
  else if (status === 'warn') data = data.filter(e => e.op === 'load-unmatched');
  if (inv === '0') data = data.filter(e => !e.invoiced);
  if (inv === '1') data = data.filter(e => e.invoiced);
  if (cl) data = data.filter(e => e.clientId === cl);
data.sort((a, b) => {

  const aInYard =
    a.op === 'unload' &&
    !a.loaded;

  const bInYard =
    b.op === 'unload' &&
    !b.loaded;

  if (aInYard && !bInYard) return -1;
  if (!aInYard && bInYard) return 1;

  return (a.unloadDate || '')
    .localeCompare(b.unloadDate || '');

});
  document.getElementById('all-table').innerHTML = tableWrap(data.map(e => entryRow(e)).join(''));
}

function renderClientDetail(cid, tab) {
  if (!cid) return;
  tab = tab || 'inyard';
  const c = clientById(cid); if (!c) return;
  const ai = CLIENTS.filter(x=>!x.deleted).findIndex(x=>x.id===cid) % AV_BG.length;
  const txAll = DB.filter(e => !e.deleted && e.clientId === cid);
  const inYardRows = txAll.filter(e => e.op === 'unload' && !e.loaded);
  const pendingRows = txAll.filter(e => !e.invoiced && (e.op === 'cross' || (e.op === 'unload' && e.loaded)));
  const invoicedRows = txAll.filter(e => e.invoiced);
  const unpaidInvGroups = {};
  invoicedRows.filter(e => !e.paidDate && e.invoiceNo).forEach(e => { (unpaidInvGroups[e.invoiceNo] = unpaidInvGroups[e.invoiceNo] || []).push(e); });

  const TABS = [
    ['inyard', `In Yard (${inYardRows.length})`],
    ['alltx', `All Transactions (${txAll.length})`],
    ['pending', `Pending Invoice (${pendingRows.length})`],
    ['invoiced', `Invoiced (${invoicedRows.length})`],
    ['ppay', `Pending Payment (${Object.keys(unpaidInvGroups).length} invoices)`]
  ];
  const tabBtns = TABS.map(([id,lbl]) =>
    `<button class="cdp-tab${tab===id?' active':''}" onclick="setDetailTab('${cid}','${id}')">${lbl}</button>`
  ).join('');

  let bodyHtml = '';

  if (tab === 'inyard') {
    const tS = inYardRows.reduce((s,e) => s + calcTotal(e).storageCost, 0);
    const tT = inYardRows.reduce((s,e) => s + calcTotal(e).total, 0);
    bodyHtml = `<div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
      <button class="btn" style="background:#16a34a;color:#fff;border-color:#16a34a" onclick="exportClientInYardExcel('${cid}')"><i class="ti ti-file-spreadsheet"></i> Export Excel</button>
    </div>` + (inYardRows.length ? yardTableWrap(inYardRows.map(e=>yardRow(e)).join('')) +
      `<div style="text-align:right;font-size:12px;color:var(--text2);margin-top:6px">Accrued storage: <strong>RO ${tS.toFixed(2)}</strong> &nbsp;|&nbsp; Total accrued: <strong>RO ${tT.toFixed(2)}</strong></div>` :
      '<div class="empty">No containers in yard for this client.</div>');
  }
  else if (tab === 'alltx') {
    const sorted = [...txAll].sort((a,b) => (b.unloadDate||b.loadDate||'').localeCompare(a.unloadDate||a.loadDate||''));
    const total = sorted.reduce((s,e) => s + calcTotal(e).total, 0);
    const tfoot = sorted.length ? `<tfoot><tr class="tfoot-row"><td colspan="7" style="padding:7px 8px">Total</td><td>RO ${total.toFixed(2)}</td><td colspan="3"></td></tr></tfoot>` : '';
    bodyHtml = `<div style="margin-bottom:1rem;display:flex;gap:8px">
      <button class="btn btn-primary" onclick="bulkInvoiceSelected()">Assign Invoice to Selected</button>
    </div>` + tableWrap(sorted.map(e=>entryRow(e)).join(''), tfoot);
  }
  else if (tab === 'pending') {
    const sorted = [...pendingRows].sort((a,b) => (a.unloadDate||'').localeCompare(b.unloadDate||''));
    const total = sorted.reduce((s,e) => s + calcTotal(e).total, 0);
    const tfoot = sorted.length ? `<tfoot><tr class="tfoot-row"><td colspan="7" style="padding:7px 8px">Pending total</td><td>RO ${total.toFixed(2)}</td><td colspan="3"></td></tr></tfoot>` : '';
    bodyHtml = `<div style="margin-bottom:1rem;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="bulkInvoiceSelected()">Assign Invoice to Selected</button>
      <button class="btn" style="background:#16a34a;color:#fff;border-color:#16a34a" onclick="exportClientBillingExcel('${cid}')"><i class="ti ti-file-spreadsheet"></i> Billing Excel</button>
    </div>` + (sorted.length ? tableWrap(sorted.map(e=>entryRow(e)).join(''), tfoot) : '<div class="empty">No containers pending invoice.</div>');
  }
  else if (tab === 'invoiced') {
    const sorted = [...invoicedRows].sort((a,b) => (b.invoiceNo||'').localeCompare(a.invoiceNo||''));
    const total = sorted.reduce((s,e) => s + calcTotal(e).total, 0);
    const tfoot = sorted.length ? `<tfoot><tr class="tfoot-row"><td colspan="7" style="padding:7px 8px">Total invoiced</td><td>RO ${total.toFixed(2)}</td><td colspan="3"></td></tr></tfoot>` : '';
    bodyHtml = `<div style="margin-bottom:1rem;display:flex;gap:8px">
      <button class="btn btn-primary mark-paid-count-btn" onclick="bulkMarkPaid()">Mark Paid (${selectedInvoices.size})</button>
    </div>` + (sorted.length ? tableWrap(sorted.map(e=>entryRow(e)).join(''), tfoot) : '<div class="empty">No invoiced containers.</div>');
  }
  else if (tab === 'ppay') {
    const groupArr = Object.entries(unpaidInvGroups).map(([inv, entries]) => ({
      inv, entries, total: entries.reduce((s,e) => s + calcTotal(e).total, 0)
    })).sort((a,b) => String(b.inv).localeCompare(String(a.inv)));
    const grandTotal = groupArr.reduce((s,g) => s + g.total, 0);
    const rows = groupArr.map(g => `<tr>
      <td><strong>${escapeHtml(g.inv)}</strong></td>
      <td style="text-align:center">${g.entries.length}</td>
      <td><strong>RO ${g.total.toFixed(2)}</strong></td>
      <td><span class="badge badge-unpaid" style="cursor:pointer" onclick="markInvoicePaidFromDetail('${g.inv}','${cid}')" title="Click to mark paid">Unpaid — click to mark paid</span></td>
      <td style="font-size:12px;color:var(--text2)">${g.entries.map(e=>e.containerNo).join(', ')}</td>
    </tr>`).join('');
    const tfoot = groupArr.length ? `<tfoot><tr class="tfoot-row"><td colspan="2">Unpaid total</td><td>RO ${grandTotal.toFixed(2)}</td><td colspan="2"></td></tr></tfoot>` : '';
    bodyHtml = `<div style="margin-bottom:1rem;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" style="background:#16a34a;color:#fff;border-color:#16a34a" onclick="exportClientPendingPaymentExcel('${cid}')"><i class="ti ti-file-spreadsheet"></i> Export Excel</button>
    </div>
    <div class="overflow-x"><table>
      <thead><tr><th>Invoice No.</th><th style="text-align:center">Containers</th><th>Amount</th><th>Status</th><th>Container nos.</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">No unpaid invoices.</td></tr>'}</tbody>
      ${tfoot}
    </table></div>`;
  }

  const totalBilled = invoicedRows.reduce((s,e) => s + calcTotal(e).total, 0);
  const unpaidAmt = invoicedRows.filter(e=>!e.paidDate).reduce((s,e) => s + calcTotal(e).total, 0);

  let panel = document.getElementById('client-detail-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'client-detail-panel';
    panel.className = 'client-detail-panel';
    document.getElementById('tab-clients').appendChild(panel);
  }
  panel.innerHTML = `
    <div class="cdp-header">
      <div class="client-avatar" style="background:${AV_BG[ai]};color:${AV_TX[ai]};width:40px;height:40px;font-size:14px">${initials(c.name)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:15px">${escapeHtml(c.name)}</div>
        <div style="font-size:12px;color:var(--text2)">
          <span style="color:#1D9E75">${inYardRows.length} in yard</span> &bull;
          <span style="color:#BA7517">${pendingRows.length} pending invoice</span> &bull;
          RO ${totalBilled.toFixed(2)} billed &bull;
          <span style="color:#B3261E">RO ${unpaidAmt.toFixed(2)} unpaid</span> &bull;
          ${txAll.length} total transactions
        </div>
      </div>
      <button class="btn btn-sm" onclick="closeClientDetail()">✕ Close</button>
    </div>
    <div class="cdp-tabs">${tabBtns}</div>
    <div class="cdp-body">${bodyHtml}</div>`;
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function exportPendingInvoiceSummary() {

  const summary = {};

  DB.forEach(e => {

    if (
      e.deleted ||
      e.invoiced
    ) return;

    const isUnloadLoad =
      e.op === 'unload' &&
      e.loaded;

    const isCross =
      e.op === 'cross';

    if (!isUnloadLoad && !isCross)
      return;

    const client =
      clientName(e.clientId) || 'Unknown';

    if (!summary[client]) {
      summary[client] = {
        unloadLoad: 0,
        cross: 0
      };
    }

    if (isUnloadLoad)
      summary[client].unloadLoad++;

    if (isCross)
      summary[client].cross++;

  });

  const rows = [];

  Object.keys(summary)
    .sort()
    .forEach(client => {

      const u =
        summary[client].unloadLoad;

      const c =
        summary[client].cross;

      rows.push({
        'Client': client,
        'Unload + Load Pending': u,
        'Cross Load Pending': c,
        'Total Pending': u + c
      });

    });

  if (!rows.length) {
    alert('No pending invoices.');
    return;
  }

  const ws =
    XLSX.utils.json_to_sheet(rows);

  ws['!cols'] = [
    { wch: 35 },
    { wch: 20 },
    { wch: 20 },
    { wch: 15 }
  ];

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    'Pending Summary'
  );

  XLSX.writeFile(
    wb,
    `Pending_Invoice_Summary_${today()}.xlsx`
  );

}

function renderPaymentsTable() {
  const pf = document.getElementById('f-pay-status')?.value || '';
  const cl = document.getElementById('f-pay-cl')?.value || '';
  let data = filterByClient(DB.filter(e => !e.deleted && e.invoiced && e.invoiceNo));
  if (cl) data = data.filter(e => e.clientId === cl);
  const groups = {};
  data.forEach(e => { (groups[e.invoiceNo] = groups[e.invoiceNo] || []).push(e); });
  let groupArr = Object.entries(groups).map(([inv, entries]) => {
    const isPaid = entries.every(e => e.paidDate);
    const total = entries.reduce((s,e) => s + calcTotal(e).total, 0);
    const paidDate = isPaid ? entries.map(e=>e.paidDate).sort().pop() : '';
    return { inv, entries, isPaid, total, paidDate, cId: entries[0].clientId };
  });
  if (pf === 'paid') groupArr = groupArr.filter(g => g.isPaid);
  if (pf === 'unpaid') groupArr = groupArr.filter(g => !g.isPaid);
  groupArr.sort((a,b) => String(b.inv).localeCompare(String(a.inv)));
  const grandTotal = groupArr.reduce((s,g) => s + g.total, 0);
  const unpaidTotal = groupArr.filter(g=>!g.isPaid).reduce((s,g) => s + g.total, 0);
  const rows = groupArr.map(g => {
    const allSel = g.entries.length > 0 && g.entries.every(e => selectedInvoices.has(e.id));
    return `<tr>
      <td><input type="checkbox" ${allSel?'checked':''} onchange="toggleGroupSelect('${g.inv}',this.checked)"></td>

    </tr>`;
  }).join('');
  const tfoot = groupArr.length ? `<tfoot>
    <tr class="tfoot-row"><td colspan="4">Grand total</td><td>RO ${grandTotal.toFixed(2)}</td><td colspan="2"></td></tr>

}
function toggleGroupSelect(invoiceNo, checked) {
  const ids = DB.filter(e => !e.deleted && e.invoiced && String(e.invoiceNo) === String(invoiceNo)).map(e=>e.id);

function bulkToggleInvoicePaid(invoiceNo) {
  const entries = DB.filter(e => !e.deleted && e.invoiced && String(e.invoiceNo) === String(invoiceNo));

function copyClientLink(clientName) {
  const url = 'https://rachitoman.github.io/yardwork/?client=' + encodeURIComponent(clientName);
  navigator.clipboard.writeText(url).then(() => {
    alert('Client portal link copied!\n\n' + url + '\n\nSend this link to ' + clientName + '. They will only see their own containers.');
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Client portal link copied!\n\n' + url + '\n\nSend this link to ' + clientName + '. They will only see their own containers.');
  });
}

  render();
}
async function refreshLock() {
  document.getElementById('lock-time-msg').textContent = 'Checking…';
  await loadData();
  if (!LOCK_INFO.lockedBy) {
    document.getElementById('lock-screen').classList.remove('show');
    await acquireLock('AKHIL');
    populateClientDropdowns();
    render();
  } else {
    showLockScreen();
  }
}
function showLockScreen() {
  if (isClientPortal()) return; // never show lock screen to clients
  const by = LOCK_INFO.lockedBy || 'Someone';
  const since = LOCK_INFO.lockedAt ? new Date(LOCK_INFO.lockedAt).toLocaleTimeString() : '';
  document.getElementById('lock-user-msg').textContent =
    by + ' is currently using this system. Please wait for them to finish or take over.';
  document.getElementById('lock-time-msg').textContent =
    since ? 'Session started at ' + since : '';
  document.getElementById('lock-screen').classList.add('show');
}
function hideLoading() {
  const el = document.getElementById('loading-screen');
  if (el) el.style.display = 'none';
}

(async function(){
  // ── Client portal: check URL FIRST before any network call ──
  if (isClientPortal()) {
    document.getElementById('loading-msg').textContent = 'Loading your containers…';
    await loadData(true); // skipLock — client portal never participates in lock
    hideLoading();
    populateClientDropdowns();
    applyUrlClientFilter();
    // Apply client-portal CSS class to body (survives all re-renders)
    document.body.classList.add('client-portal');

    // Also hide explicitly as belt-and-braces
    ['topbar-right','tab-btn-clients','tab-btn-rates','tab-btn-unpaid'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.setProperty('display','none','important');
    });

    // Replace topbar-left with clean client header
    const topbarLeft = document.querySelector('.topbar-left');
    if (topbarLeft) {
      const clientLabel = new URLSearchParams(window.location.search).get('client');
      topbarLeft.innerHTML = `
        <div>
          <div style="font-size:16px;font-weight:500">📦 Yard Container Tracker</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">Viewing as: <strong>${clientLabel}</strong></div>
        </div>`;
    }

    render();
    return;
  }

  // ── Admin path ──
  document.getElementById('loading-msg').textContent = 'Loading data…';
  await loadData();
  hideLoading();

  if (!LOCK_INFO.lockedBy) {
    await acquireLock('AKHIL');
    populateClientDropdowns();
    applyUrlClientFilter();
    render();
  } else {
    showLockScreen();
  }
})();
</script>
</body>
</html>
