<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yard Container Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f5f5f4;
  --bg3: #eeede9;
  --text: #1a1a1a;
  --text2: #6b6b6b;
  --text3: #9b9b9b;
  --border: rgba(0,0,0,0.12);
  --border2: rgba(0,0,0,0.22);
  --radius: 8px;
  --radius-lg: 12px;
  --info-bg: #E6F1FB;
  --info-text: #0C447C;
  --success-bg: #E1F5EE;
  --success-text: #085041;
  --warn-bg: #FAEEDA;
  --warn-text: #633806;
  --danger-bg: #FCEBEB;
  --danger-text: #A32D2D;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1c;
    --bg2: #252525;
    --bg3: #2e2e2e;
    --text: #f0f0f0;
    --text2: #a0a0a0;
    --text3: #666;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.2);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: var(--text); background: var(--bg3); min-height: 100vh; }
.topbar { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; }
.topbar-left { display: flex; align-items: center; gap: 16px; }
.app-title { font-size: 16px; font-weight: 500; }
.today-label { font-size: 12px; color: var(--text2); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
.stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
.stat-num { font-size: 22px; font-weight: 500; margin-top: 3px; }
.stat-label { font-size: 11px; color: var(--text2); }
.tabs { display: flex; border-bottom: 0.5px solid var(--border); margin-bottom: 1.25rem; background: var(--bg); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 0 0.5rem; overflow-x: auto; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; color: var(--text2); border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; white-space: nowrap; }
.tab.active { color: var(--text); border-bottom: 2px solid var(--text); font-weight: 500; }
.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.section-title { font-size: 15px; font-weight: 500; margin-bottom: 1rem; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; font-size: 14px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { box-shadow: 0 0 0 2px rgba(0,0,0,0.15); }
.field textarea { height: 58px; resize: vertical; }
.btn { padding: 7px 14px; font-size: 13px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; font-weight: 500; transition: background 0.1s; }
.btn:hover { background: var(--bg2); }
.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn-primary:hover { opacity: 0.85; }
.btn-client { background: #2563eb; color: #fff; border: none; }
.btn-bulk { background: #16a34a; color: #fff; border: none; }
.btn-sm { padding: 3px 9px; font-size: 12px; }
.btn-danger { border-color: #E24B4A; color: #A32D2D; }
.btn-danger:hover { background: #FCEBEB; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 7px 8px; font-weight: 700; font-size: 14px; color: #000; background: #e2e2e2; border-bottom: 0.5px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
td { padding: 7px 8px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.tfoot-row td { font-weight: 500; background: var(--bg2); }
.badge { display: inline-block; padding: 4px 10px; border-radius: var(--radius); font-size: 13px; font-weight: 600; }
.badge-in { background: #E1F5EE; color: #085041; }
.badge-out { background: #EAF3DE; color: #27500A; }
.badge-cross { background: #EEEDFE; color: #3C3489; }
.badge-warn { background: #FAEEDA; color: #633806; }
.badge-inv { background: #E6F1FB; color: #0C447C; }
.badge-paid { background: #E3F6E8; color: #1D7A3C; cursor: pointer; }
.badge-unpaid { background: #FDECEC; color: #B3261E; cursor: pointer; }
.row-warn { background: rgba(250,238,218,0.3); }
table tbody tr:nth-child(even) { background: #ebebeb; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.filter-bar input, .filter-bar select { padding: 6px 10px; font-size: 13px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); }
.empty { text-align: center; padding: 2rem; color: var(--text2); font-size: 13px; }
.sep { height: 0.5px; background: var(--border); margin: 1rem 0; }
.op-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.op-btn { flex: 1; padding: 9px 4px; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; text-align: center; font-size: 12px; background: var(--bg); color: var(--text2); }
.op-btn.sel-unload { border-color: #1D9E75; background: #E1F5EE; color: #085041; font-weight: 500; }
.op-btn.sel-cross { border-color: #7F77DD; background: #EEEDFE; color: #3C3489; font-weight: 500; }
.info-box { padding: 8px 10px; border-radius: var(--radius); font-size: 12px; margin-top: 8px; background: var(--bg2); color: var(--text2); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 1.5rem; width: 460px; max-width: 96vw; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
.client-avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; }
.client-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.client-row:last-child { border-bottom: none; }
.client-summary { font-size: 12px; color: var(--text2); margin-top: 2px; }
.overflow-x { overflow-x: auto; }

/* Login screen */
#login-screen { display:flex; position:fixed; inset:0; background:var(--bg3); z-index:999; align-items:center; justify-content:center; }
.login-card { background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:2.5rem 2rem; max-width:380px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.12); }
.login-icon { font-size:40px; margin-bottom:1rem; text-align:center; }
.login-title { font-size:20px; font-weight:600; margin-bottom:0.25rem; text-align:center; }
.login-sub { font-size:13px; color:var(--text2); margin-bottom:1.5rem; text-align:center; }
.login-error { margin-top:8px; padding:8px 10px; background:var(--danger-bg); color:var(--danger-text); border-radius:var(--radius); font-size:13px; }

/* Client portal overrides */
body.client-portal .admin-only { display: none !important; }

/* Client detail panel */
.client-detail-panel { border:0.5px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-top:1rem; background:var(--bg); }
.cdp-header { display:flex; align-items:center; gap:12px; padding:1rem 1.25rem; border-bottom:0.5px solid var(--border); background:var(--bg2); flex-wrap:wrap; }
.cdp-tabs { display:flex; border-bottom:0.5px solid var(--border); padding:0 1rem; overflow-x:auto; background:var(--bg); }
.cdp-tab { padding:8px 14px; cursor:pointer; font-size:12px; color:var(--text2); border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; white-space:nowrap; }
.cdp-tab.active { color:var(--text); border-bottom:2px solid var(--text); font-weight:500; }
.cdp-body { padding:1rem 1.25rem; }

@media (max-width: 600px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr; }
  .topbar { padding: 0 1rem; }
  .container { padding: 1rem 0.5rem; }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">📦</div>
    <div class="login-title">Yard Container Tracker</div>
    <div class="login-sub">Sign in to continue</div>
    <div class="field" style="margin-bottom:10px">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%;padding:10px">Sign in</button>
    <div id="login-error" class="login-error" style="display:none"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading-screen" style="display:none;position:fixed;inset:0;background:var(--bg3);z-index:998;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div style="font-size:32px">📦</div>
  <div style="font-size:16px;font-weight:500">Yard Container Tracker</div>
  <div style="font-size:13px;color:var(--text2)">Loading data…</div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <div class="app-title"><i class="ti ti-container"></i> Yard Container Tracker</div>
        <div class="today-label" id="today-label"></div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="sync-status" style="font-size:12px;color:var(--text2);min-width:70px;text-align:right"></span>
      <select id="global-client-filter" onchange="applyGlobalFilter()" style="padding:6px 10px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text)" class="admin-only">
        <option value="">All clients</option>
      </select>
      <button class="btn btn-client admin-only" onclick="openClientModal()"><i class="ti ti-user-plus"></i> Add Client</button>
      <button class="btn btn-primary admin-only" onclick="openAddModal()"><i class="ti ti-plus"></i> New Entry</button>
      <button class="btn btn-bulk admin-only" onclick="openBulkModal()"><i class="ti ti-stack-2"></i> Bulk Entry</button>
      <button class="btn" onclick="doLogout()"><i class="ti ti-logout"></i> Sign out</button>
    </div>
  </div>

  <div class="container">
    <div class="stats-grid admin-only" id="stats"></div>

    <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
      <div class="tabs" id="tabs">
        <button class="tab active" onclick="switchTab('yard',this)" id="tab-btn-yard">In Yard</button>
        <button class="tab admin-only" onclick="switchTab('pending',this)" id="tab-btn-pending">Pending Invoice</button>
        <button class="tab admin-only" onclick="switchTab('invoiced',this)" id="tab-btn-invoiced">Invoiced</button>
        <button class="tab admin-only" onclick="switchTab('payments',this)" id="tab-btn-payments">Pending Payment</button>
        <button class="tab admin-only" onclick="switchTab('completed',this)" id="tab-btn-completed">Completed</button>
        <button class="tab admin-only" onclick="switchTab('clients',this)" id="tab-btn-clients">Clients</button>
        <button class="tab admin-only" onclick="switchTab('rates',this)" id="tab-btn-rates">Rate Sheet</button>
      </div>
      <div style="padding:1.25rem">
        <div id="tab-yard"></div>
        <div id="tab-pending" style="display:none"></div>
        <div id="tab-invoiced" style="display:none"></div>
        <div id="tab-payments" style="display:none"></div>
        <div id="tab-completed" style="display:none"></div>
        <div id="tab-clients" style="display:none"></div>
        <div id="tab-rates" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- CLIENT PORTAL (non-admin) -->
<div id="client-portal" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <div class="app-title"><i class="ti ti-container"></i> Yard Container Tracker</div>
        <div class="today-label" id="portal-client-name"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="doLogout()"><i class="ti ti-logout"></i> Sign out</button>
    </div>
  </div>
  <div class="container">
    <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
      <div class="tabs">
        <button class="tab active" onclick="switchPortalTab('in-yard',this)">In Yard</button>
        <button class="tab" onclick="switchPortalTab('completed',this)">Completed</button>
      </div>
      <div style="padding:1.25rem">
        <div id="portal-in-yard"></div>
        <div id="portal-completed" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ MODALS ═══ -->

<!-- Add Entry -->
<div id="modal-add" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">New container entry</div>
    <div class="op-row">
      <button class="op-btn sel-unload" id="btn-unload" onclick="setOp('unload')"><i class="ti ti-arrow-bar-to-down"></i> Unloading</button>
      <button class="op-btn" id="btn-cross" onclick="setOp('cross')"><i class="ti ti-arrows-exchange"></i> Cross-loading</button>
    </div>
    <div class="grid2" style="margin-bottom:10px">
      <div class="field">
        <label>Container no.</label>
        <input id="f-cnum" placeholder="e.g. MSCU1234567" style="text-transform:uppercase">
      </div>
      <div class="field">
        <label>Gate In Date</label>
        <input id="f-date" type="date">
      </div>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Client</label>
      <select id="f-client"><option value="">— Select client —</option></select>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Sales Ref</label>
      <input id="f-salesref" placeholder="Sales person">
    </div>
    <div class="field">
      <label>Remarks</label>
      <textarea id="f-remarks" placeholder="Optional notes"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-add')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save entry</button>
    </div>
  </div>
</div>

<!-- Bulk Entry -->
<div id="modal-bulk" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Bulk Container Entry</div>
    <div class="field" style="margin-bottom:10px">
      <label>Client</label>
      <select id="bulk-client"></select>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Sales Ref</label>
      <input id="bulk-salesref" placeholder="Sales person">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Default Gate In Date</label>
      <input id="bulk-date" type="date">
    </div>
    <div class="field">
      <label>Container Numbers (one per line)</label>
      <textarea id="bulk-list" style="height:180px" placeholder="REGU1235760&#10;REGU3228672&#10;TGBU8071201"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-bulk')">Cancel</button>
      <button class="btn btn-primary" onclick="saveBulkEntries()">Save All</button>
    </div>
  </div>
</div>

<!-- Client Modal -->
<div id="modal-client" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="client-modal-title">Add Client</div>
    <div class="field" style="margin-bottom:10px">
      <label>Client Name</label>
      <input id="cl-name" placeholder="Company or person name">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Contact / Phone</label>
      <input id="cl-contact" placeholder="Optional">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Email</label>
      <input id="cl-email" placeholder="Optional">
    </div>
    <div class="grid2" style="margin-bottom:10px">
      <div class="field">
        <label>Storage Rate (RO/day)</label>
        <input id="cl-rate-storage" type="number" step="0.1" value="1.5">
      </div>
      <div class="field">
        <label>Operation Rate (RO)</label>
        <input id="cl-rate-op" type="number" step="1" value="25">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-client')">Cancel</button>
      <button class="btn btn-primary" onclick="saveClient()">Save Client</button>
    </div>
  </div>
</div>

<!-- Client Login Modal -->
<div id="modal-client-login" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Create Client Portal Login</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:1rem" id="client-login-for"></div>
    <div class="field" style="margin-bottom:10px">
      <label>Email</label>
      <input id="cl-login-email" type="email" placeholder="client@example.com">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Password</label>
      <input id="cl-login-pass" type="password" placeholder="At least 6 characters">
    </div>
    <div id="cl-login-error" style="display:none;margin-top:8px;padding:8px 10px;background:var(--danger-bg);color:var(--danger-text);border-radius:var(--radius);font-size:13px"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-client-login')">Cancel</button>
      <button class="btn btn-primary" id="cl-login-save-btn" onclick="saveClientLogin()">Create Login</button>
    </div>
  </div>
</div>

<!-- Mark Loaded Modal -->
<div id="modal-load" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Mark Container Loaded</div>
    <div class="field">
      <label>Load Date</label>
      <input id="load-date" type="date">
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-load')">Cancel</button>
      <button class="btn btn-primary" onclick="saveLoadedDate()">Save</button>
    </div>
  </div>
</div>

<!-- Edit Entry Modal -->
<div id="modal-edit" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Edit Entry</div>
    <div class="field" style="margin-bottom:10px">
      <label>Container No.</label>
      <input id="edit-cnum" type="text">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Client</label>
      <select id="edit-client"></select>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Sales Ref</label>
      <input id="edit-salesref" type="text">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Gate In Date</label>
      <input id="edit-unload-date" type="date">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Load Date <span style="font-size:11px;color:var(--text2)">(leave blank if still in yard)</span></label>
      <input id="edit-load-date" type="date">
    </div>
    <div class="field" style="margin-bottom:10px">
      <label>Remarks</label>
      <textarea id="edit-remarks"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-edit')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Invoice Modal -->
<div id="modal-invoice" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Mark as Invoiced</div>
    <div class="field">
      <label>Invoice Number</label>
      <input id="inv-num" placeholder="e.g. INV-2024-001">
    </div>
    <div class="info-box" id="inv-desc" style="margin-top:8px"></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-invoice')">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Save</button>
    </div>
  </div>
</div>

<!-- Paid Modal -->
<div id="modal-paid" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Mark Invoice Paid</div>
    <div class="field">
      <label>Payment Date</label>
      <input id="paid-date" type="date">
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-paid')">Cancel</button>
      <button class="btn btn-primary" onclick="savePaidDate()">Save</button>
    </div>
  </div>
</div>

<script>
// ─── Supabase Init ───────────────────────────────────────────────────────────
if (!window.supabase) {

// ─── Helpers ─────────────────────────────────────────────────────────────────
function today() { return new Date().toISOString().split('T')[0]; }
function parseDate(s) { if (!s) return null; return new Date(s + 'T00:00:00'); }
function daysBetween(a, b) {
  if (!a) return 0;
  const d1 = parseDate(a), d2 = b ? parseDate(b) : new Date();
  return Math.max(0, Math.floor((d2 - d1) / 86400000));
}
function fmtDate(s) {
  if (!s) return '—';
  const d = parseDate(s);
  return d ? d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) : '—';
}
function fmtRO(n) { return 'RO ' + Number(n||0).toFixed(3); }
function clientName(id) { const c = allClients.find(c => c.id === id); return c ? c.name : '—'; }
function escHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function avatarStyle(name) {
  const i = name ? (name.charCodeAt(0) % AV_BG.length) : 0;
  return `background:${AV_BG[i]};color:${AV_TX[i]}`;
}
function initials(name) { if (!name) return '?'; const p = name.trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function calcStorage(tx) {
  const c = allClients.find(c => c.id === tx.client_id);
  const rate = c ? (parseFloat(c.rate_storage)||1.5) : 1.5;
  return daysBetween(tx.unload_date, tx.load_date||null) * rate;
}
function calcOp(tx) {
  const c = allClients.find(c => c.id === tx.client_id);
  return c ? (parseFloat(c.rate_op)||25) : 25;
}
function calcTotal(tx) { return calcStorage(tx) + calcOp(tx); }
function setSyncStatus(s) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (s === 'saving') el.textContent = 'Saving…';
  else if (s === 'saved') { el.textContent = 'Saved ✓'; setTimeout(()=>{ if(el.textContent==='Saved ✓') el.textContent=''; },1500); }
  else if (s === 'error') el.textContent = 'Error!';
  else el.textContent = '';
}
function showLoading(v) { document.getElementById('loading-screen').style.display = v ? 'flex' : 'none'; }

// ─── Login ────────────────────────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
    await onLogin(data.user);
  } catch(e) {
    errEl.textContent = 'Login failed. Please try again.'; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

async function onLogin(user) {
  currentUser = user;
  showLoading(true);
  document.getElementById('login-screen').style.display = 'none';

  // Check admin
  const { data: adminRow } = await sb.from('admin_users').select('*').eq('user_id', user.id).maybeSingle();
  if (adminRow) {
    isAdmin = true;
    await loadAllData();
    document.getElementById('today-label').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    showLoading(false);
    document.getElementById('app').style.display = 'block';
    renderStats();
    renderTab('yard');
    return;
  }

  // Check client
  const { data: clientUserRow } = await sb.from('client_users').select('*, clients(*)').eq('user_id', user.id).maybeSingle();
  if (clientUserRow && clientUserRow.clients) {
    portalClientRecord = clientUserRow.clients;
    await loadAllData();
    showLoading(false);
    document.getElementById('portal-client-name').textContent = portalClientRecord.name;
    document.getElementById('client-portal').style.display = 'block';
    renderPortalTab('in-yard');
    return;
  }

  showLoading(false);
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-error').textContent = 'Account not authorised. Contact admin.';
  document.getElementById('login-error').style.display = 'block';
  await sb.auth.signOut();
}

async function doLogout() {
  await sb.auth.signOut();
  location.reload();
}

// ─── Data ─────────────────────────────────────────────────────────────────────
async function loadAllData() {
  const [{ data: txs }, { data: cls }] = await Promise.all([
    sb.from('transactions').select('*').eq('deleted', false).order('created_at', { ascending: false }),
    sb.from('clients').select('*').eq('deleted', false).order('name')
  ]);
  allTransactions = txs || [];
  allClients = cls || [];
  rebuildClientFilter();
}

async function reload() {
  setSyncStatus('saving');
  await loadAllData();
  setSyncStatus('saved');
  renderTab(currentTab);
  renderStats();
}

// ─── Client filter dropdown ───────────────────────────────────────────────────
function rebuildClientFilter() {
  const sel = document.getElementById('global-client-filter');
  if (!sel) return;
  const val = sel.value;
  sel.innerHTML = '<option value="">All clients</option>' +
    allClients.map(c => `<option value="${c.id}"${c.id===val?' selected':''}>${escHtml(c.name)}</option>`).join('');
}
function applyGlobalFilter() { renderTab(currentTab); }
function getFilteredTx() {
  const f = document.getElementById('global-client-filter');
  const fid = f ? f.value : '';
  return fid ? allTransactions.filter(t => t.client_id === fid) : allTransactions;
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function renderStats() {
  const inYard = allTransactions.filter(t => !t.loaded);
  const pending = allTransactions.filter(t => t.loaded && !t.invoiced);
  const invoiced = allTransactions.filter(t => t.invoiced && !t.paid_date);
  const paid = allTransactions.filter(t => t.paid_date);
  const totalRevenue = allTransactions.filter(t => t.paid_date).reduce((s,t) => s+calcTotal(t), 0);
  const outstanding = allTransactions.filter(t => t.invoiced && !t.paid_date).reduce((s,t) => s+calcTotal(t), 0);
  document.getElementById('stats').innerHTML = [
    ['In Yard', inYard.length, ''],
    ['Pending Invoice', pending.length, ''],
    ['Invoiced (Unpaid)', invoiced.length, ''],
    ['Total Paid', paid.length, ''],
    ['Outstanding', fmtRO(outstanding), ''],
    ['Total Revenue', fmtRO(totalRevenue), ''],
  ].map(([l,n,_]) => `<div class="stat"><div class="stat-label">${l}</div><div class="stat-num">${n}</div></div>`).join('');
}

// ─── Tab switching ────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  currentTab = name;
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  ['yard','pending','invoiced','payments','completed','clients','rates'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t === name ? '' : 'none';
  });
  renderTab(name);
}

function renderTab(name) {
  if (name === 'yard') renderYard();
  else if (name === 'pending') renderPending();
  else if (name === 'invoiced') renderInvoiced();
  else if (name === 'payments') renderPayments();
  else if (name === 'completed') renderCompleted();
  else if (name === 'clients') renderClients();
  else if (name === 'rates') renderRates();
}

function openAddModal() {
  currentOp = 'unload';
  document.getElementById('btn-unload').className = 'op-btn sel-unload';
  document.getElementById('btn-cross').className = 'op-btn';
  document.getElementById('f-cnum').value = '';
  document.getElementById('f-date').value = today();
  document.getElementById('f-salesref').value = '';
  document.getElementById('f-remarks').value = '';
  const sel = document.getElementById('f-client');
  sel.innerHTML = '<option value="">— Select client —</option>' +
    allClients.map(c => `<option value="${c.id}">${escHtml(c.name)}</option>`).join('');
  openModal('modal-add');
}
function setOp(op) {
  currentOp = op;
  document.getElementById('btn-unload').className = 'op-btn' + (op==='unload'?' sel-unload':'');
  document.getElementById('btn-cross').className = 'op-btn' + (op==='cross'?' sel-cross':'');
}
async function saveEntry() {
  const cnum = document.getElementById('f-cnum').value.trim().toUpperCase();
  const date = document.getElementById('f-date').value;
  const cid = document.getElementById('f-client').value;
  const sref = document.getElementById('f-salesref').value.trim();
  const rem = document.getElementById('f-remarks').value.trim();
  if (!cnum || !date || !cid) { alert('Container number, date and client are required.'); return; }
  setSyncStatus('saving');
  const { error } = await sb.from('transactions').insert({
    container_no: cnum, op: currentOp, unload_date: date,
    client_id: cid, sales_ref: sref||null, remarks: rem||null,
    loaded: false, invoiced: false, deleted: false
  });
  if (error) { alert('Error: ' + error.message); setSyncStatus('error'); return; }
  closeModal('modal-add');
  await reload();
}

  const date = document.getElementById('bulk-date').value;
  const sref = document.getElementById('bulk-salesref').value.trim();
  const lines = document.getElementById('bulk-list').value.trim().split('\n').map(s=>s.trim().toUpperCase()).filter(Boolean);
  if (!cid || !date || !lines.length) { alert('Please fill in client, date and container list.'); return; }
  setSyncStatus('saving');
  const rows = lines.map(cnum => ({
    container_no: cnum, op: 'unload', unload_date: date,
    client_id: cid, sales_ref: sref||null, loaded: false, invoiced: false, deleted: false
  }));
  const { error } = await sb.from('transactions').insert(rows);
  if (error) { alert('Error: ' + error.message); setSyncStatus('error'); return; }
  closeModal('modal-bulk');
  await reload();
}

// ─── Clients CRUD ─────────────────────────────────────────────────────────────
function openClientModal() {
  editingClientId = null;
  document.getElementById('client-modal-title').textContent = 'Add Client';
  document.getElementById('cl-name').value = '';
  document.getElementById('cl-contact').value = '';
  document.getElementById('cl-email').value = '';
  document.getElementById('cl-rate-storage').value = '1.5';
  document.getElementById('cl-rate-op').value = '25';
  openModal('modal-client');
}
function openEditClient(id) {
  const c = allClients.find(x => x.id === id);
  if (!c) return;
  editingClientId = id;
  document.getElementById('client-modal-title').textContent = 'Edit Client';
  document.getElementById('cl-name').value = c.name;
  document.getElementById('cl-contact').value = c.contact||'';
  document.getElementById('cl-email').value = c.email||'';
  document.getElementById('cl-rate-storage').value = c.rate_storage||1.5;
  document.getElementById('cl-rate-op').value = c.rate_op||25;
  openModal('modal-client');
}
async function saveClient() {
  const name = document.getElementById('cl-name').value.trim();
  if (!name) { alert('Client name is required.'); return; }
  const data = {
    name, contact: document.getElementById('cl-contact').value.trim()||null,
    email: document.getElementById('cl-email').value.trim()||null,
    rate_storage: parseFloat(document.getElementById('cl-rate-storage').value)||1.5,
    rate_op: parseFloat(document.getElementById('cl-rate-op').value)||25,
  };
  setSyncStatus('saving');
  let error;
  if (editingClientId) {
    ({ error } = await sb.from('clients').update(data).eq('id', editingClientId));
  } else {
    ({ error } = await sb.from('clients').insert({ ...data, deleted: false }));
  }
  if (error) { alert('Error: ' + error.message); setSyncStatus('error'); return; }
  closeModal('modal-client');
  await reload();
  if (currentTab === 'clients') renderClients();
  else if (currentTab === 'rates') renderRates();
}
async function deleteClient(id) {
  if (!confirm('Delete this client? Their transactions will remain but be unlinked.')) return;
  setSyncStatus('saving');
  const { error } = await sb.from('clients').update({ deleted: true }).eq('id', id);
  if (error) { alert('Error: ' + error.message); setSyncStatus('error'); return; }
  await reload();
}

// ─── Client Portal Login ──────────────────────────────────────────────────────
function openClientLoginModal(clientId) {
  clientLoginForId = clientId;
  const c = allClients.find(x => x.id === clientId);
  document.getElementById('client-login-for').textContent = 'Creating login for: ' + (c ? c.name : clientId);
  document.getElementById('cl-login-email').value = c?.email||'';
  document.getElementById('cl-login-pass').value = '';
  document.getElementById('cl-login-error').style.display = 'none';
  openModal('modal-client-login');
}
async function saveClientLogin() {
  const email = document.getElementById('cl-login-email').value.trim();
  const pass = document.getElementById('cl-login-pass').value;
  const errEl = document.getElementById('cl-login-error');
  const btn = document.getElementById('cl-login-save-btn');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Email and password are required.'; errEl.style.display = 'block'; return; }
  if (pass.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    // Sign up client user (uses anon key)
    const { data: signUpData, error: signUpErr } = await sb.auth.signUp({ email, password: pass });
    if (signUpErr) { errEl.textContent = signUpErr.message; errEl.style.display = 'block'; return; }
    const userId = signUpData.user?.id;
    if (!userId) { errEl.textContent = 'Sign up succeeded but no user ID returned. Check Supabase Auth settings.'; errEl.style.display = 'block'; return; }
    // Link to client
    const { error: linkErr } = await sb.from('client_users').insert({ user_id: userId, client_id: clientLoginForId });
    if (linkErr) { errEl.textContent = 'User created but link failed: ' + linkErr.message; errEl.style.display = 'block'; return; }
    closeModal('modal-client-login');
    alert(`Portal login created for ${email}`);
  } catch(e) {
    errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Create Login';
  }
}

// ─── Client Portal View ───────────────────────────────────────────────────────
function switchPortalTab(name, btn) {
  document.querySelectorAll('#client-portal .tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('portal-in-yard').style.display = name === 'in-yard' ? '' : 'none';
  document.getElementById('portal-completed').style.display = name === 'completed' ? '' : 'none';
  renderPortalTab(name);
}
function renderPortalTab(name) {
  if (!portalClientRecord) return;
  const cid = portalClientRecord.id;
  if (name === 'in-yard') {
    const txs = allTransactions.filter(t => t.client_id === cid && !t.loaded);
    const el = document.getElementById('portal-in-yard');
    if (!txs.length) { el.innerHTML = '<div class="empty">No containers currently in yard.</div>'; return; }
    el.innerHTML = `<div class="overflow-x"><table>
      <thead><tr><th>Container</th><th>Op</th><th>Gate In</th><th>Days in Yard</th><th>Sales Ref</th><th>Remarks</th></tr></thead>
      <tbody>${txs.map(t => {
        const days = daysBetween(t.unload_date);
        return `<tr>
          <td><strong>${escHtml(t.container_no)}</strong></td>
          <td><span class="badge badge-${t.op==='cross'?'cross':'in'}">${t.op==='cross'?'Cross':'Unload'}</span></td>
          <td>${fmtDate(t.unload_date)}</td>
          <td>${days}d</td>
          <td>${escHtml(t.sales_ref||'')}</td>
          <td>${escHtml(t.remarks||'')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  } else {
    const txs = allTransactions.filter(t => t.client_id === cid && t.loaded);
    const el = document.getElementById('portal-completed');
    if (!txs.length) { el.innerHTML = '<div class="empty">No completed containers.</div>'; return; }
    el.innerHTML = `<div class="overflow-x"><table>
      <thead><tr><th>Container</th><th>Op</th><th>Gate In</th><th>Gate Out</th><th>Days</th><th>Sales Ref</th><th>Remarks</th></tr></thead>
      <tbody>${txs.map(t => `<tr>
        <td><strong>${escHtml(t.container_no)}</strong></td>
        <td><span class="badge badge-${t.op==='cross'?'cross':'in'}">${t.op==='cross'?'Cross':'Unload'}</span></td>
        <td>${fmtDate(t.unload_date)}</td>
        <td>${fmtDate(t.load_date)}</td>
        <td>${daysBetween(t.unload_date,t.load_date)}d</td>
        <td>${escHtml(t.sales_ref||'')}</td>
        <td>${escHtml(t.remarks||'')}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }
}

// ─── Close modals on backdrop click ──────────────────────────────────────────
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

// ─── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await onLogin(session.user);
  }
  // else: login screen is already visible
})();
</script>
